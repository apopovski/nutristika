<!DOCTYPE html>
<html>
<head>
<style>
.leaf-container {
  width: 300px;
  height: 400px;
  overflow: hidden;
}

.leaf-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 20%;
  transform: scale(1.42);
  transform-origin: center;
  clip-path: polygon(50% 0%, 78% 14%, 92% 42%, 80% 74%, 50% 100%, 20% 74%, 8% 42%, 22% 14%);
}
</style>
</head>
<body>

<div class="leaf-container">
  <img src="images/Jasmina-2.jpeg?v=2" alt="Jasmina in leaf frame">
</div>

</body>
</html>
